<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RF power amplifier module">
  <defs>
    <linearGradient id="pa-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20272a"/>
      <stop offset="1" stop-color="#0e1315"/>
    </linearGradient>
    <linearGradient id="pa-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0BAEC9"/>
      <stop offset="0.5" stop-color="#16C0A8"/>
      <stop offset="1" stop-color="#5EBE89"/>
    </linearGradient>
    <filter id="pa-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- heatsink fins -->
  <g fill="#161c1e">
    <rect x="70" y="52" width="260" height="12" rx="3"/>
    <rect x="70" y="70" width="260" height="12" rx="3"/>
    <rect x="70" y="88" width="260" height="12" rx="3"/>
  </g>

  <!-- amplifier body -->
  <rect x="64" y="104" width="272" height="118" rx="10" fill="url(#pa-body)" stroke="#2A302C" stroke-width="1.5"/>
  <rect x="64" y="104" width="272" height="118" rx="10" fill="none" stroke="url(#pa-teal)" stroke-width="1.5" opacity="0.5"/>

  <!-- label plate -->
  <rect x="84" y="126" width="232" height="74" rx="6" fill="#0a0f10" stroke="#222a2b"/>
  <text x="100" y="152" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#eaf3f0">TELOGICA</text>
  <text x="100" y="172" font-family="Inter, sans-serif" font-size="11" fill="#9AA4A0">RF POWER AMPLIFIER</text>
  <text x="100" y="190" font-family="monospace" font-size="12" font-weight="700" fill="#16C0A8">100 MHz – 40 GHz</text>

  <!-- status LED -->
  <circle cx="298" cy="148" r="5" fill="url(#pa-teal)" filter="url(#pa-glow)"/>
  <text x="288" y="186" font-family="monospace" font-size="8" fill="#5EBE89" text-anchor="middle">ON</text>

  <!-- SMA connectors -->
  <g>
    <rect x="40" y="150" width="26" height="26" rx="4" fill="#3a4145"/>
    <circle cx="53" cy="163" r="6" fill="#c9cfcb"/><circle cx="53" cy="163" r="2.4" fill="#0a0f10"/>
    <text x="53" y="192" font-family="monospace" font-size="9" fill="#9AA4A0" text-anchor="middle">IN</text>
  </g>
  <g>
    <rect x="334" y="150" width="26" height="26" rx="4" fill="#3a4145"/>
    <circle cx="347" cy="163" r="6" fill="#c9cfcb"/><circle cx="347" cy="163" r="2.4" fill="#0a0f10"/>
    <text x="347" y="192" font-family="monospace" font-size="9" fill="#9AA4A0" text-anchor="middle">OUT</text>
  </g>

  <!-- signal path -->
  <path d="M66 163 H84" stroke="url(#pa-teal)" stroke-width="2"/>
  <path d="M316 163 H334" stroke="url(#pa-teal)" stroke-width="2"/>

  <!-- gain waveform -->
  <path d="M108 244 q10 -14 20 0 t20 0" stroke="#5EBE89" stroke-width="1.6" fill="none" opacity="0.7"/>
  <path d="M252 232 q16 -26 32 0 t32 0" stroke="#16C0A8" stroke-width="2.2" fill="none" opacity="0.9"/>
  <text x="200" y="248" font-family="monospace" font-size="10" fill="#5A6560" text-anchor="middle">GAIN</text>
</svg>
